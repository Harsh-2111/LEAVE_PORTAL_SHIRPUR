services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostel_leave_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET}
      HOSTEL_EMAIL: ${HOSTEL_EMAIL}
      APP_ENV: ${APP_ENV}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: hostel_leave_db
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./hostel_leave_schema_v2.sql:/docker-entrypoint-initdb.d/01_hostel_leave_schema_v2.sql:ro
      - ./dev_seed.sql:/docker-entrypoint-initdb.d/02_dev_seed.sql:ro
      - ./hostel_leave_migration_v3.sql:/docker-entrypoint-initdb.d/03_hostel_leave_migration_v3.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: hostel_leave_phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  mysql_data:
